<!-- ossec.conf excerpt for the Windows Wazuh agent (soc-lab telemetry sources).
     Merge inside the agent's C:\Program Files (x86)\ossec-agent\ossec.conf,
     inside the existing <ossec_config> element (the snippet below shows the
     full surrounding context so the file stays valid. After editing, restart
     the agent: Restart-Service WazuhSvc (or net stop/start ossec-agent). -->

<ossec_config>
  <client>
    <server>
      <address>wazuh-server</address>
      <port>1514</port>
      <protocol>udp</protocol>
    </server>
  </client>

  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
  </localfile>
</ossec_config>