<!-- ossec.conf snippets for the Windows Wazuh agent.
     Append the <localfile> entries inside <ossec_config> (and ensure the
     Sysmon channel name matches your install). -->

<localfile>
  <log_format>eventchannel</log_format>
  <location>Microsoft-Windows-Sysmon/Operational</location>
</localfile>

<localfile>
  <log_format>eventchannel</log_format>
  <location>Microsoft-Windows-PowerShell/Operational</location>
</localfile>

<localfile>
  <log_format>eventchannel</log_format>
  <location>Security</location>
</localfile>
